<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tender Monitor — Global Procurement Opportunities</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== TOKENS: LIGHT (default) ===== */
  :root{
    --bg:#f7f8fa;
    --bg-alt:#ffffff;
    --surface:#ffffff;
    --surface-1:#ffffff;
    --surface-2:#f1f3f6;
    --surface-hover:#e9ecf1;

    --border:#e2e5ea;
    --border-strong:#c9ced6;

    --text:#1a1d23;
    --text-dim:#4b5263;
    --text-muted:#858d9d;

    --accent:#2563eb;
    --accent-hover:#1d4fd8;
    --accent-soft:rgba(37,99,235,0.08);
    --accent-text:#ffffff;

    --critical:#dc2626;
    --critical-soft:rgba(220,38,38,0.06);
    --safe:#16a34a;
    --safe-soft:rgba(22,163,74,0.08);
    --warning:#d97706;
    --warning-soft:rgba(217,119,6,0.08);

    --b-bim:#0891b2;
    --b-laser:#b45309;
    --b-migration:#7c3aed;
    --b-apm:#be185d;
    --b-aim:#059669;
    --b-digital:#2563eb;
    --b-software:#9333ea;
    --b-upgrade:#c2410c;

    --sans:'Geist','Helvetica Neue',-apple-system,sans-serif;
    --mono:'Geist Mono',ui-monospace,Menlo,monospace;

    --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
    --shadow-md:0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg:0 8px 24px rgba(0,0,0,0.12);

    --radius-sm:6px;
    --radius-md:8px;
    --radius-lg:12px;

    --header-bg:rgba(247,248,250,0.92);
  }

  /* ===== TOKENS: DARK ===== */
  [data-theme="dark"]{
    --bg:#0f1117;
    --bg-alt:#151821;
    --surface:#1a1d27;
    --surface-1:#1e2130;
    --surface-2:#252838;
    --surface-hover:#2d3044;

    --border:#2a2d3a;
    --border-strong:#3a3e50;

    --text:#e4e6ed;
    --text-dim:#a0a5b5;
    --text-muted:#6b7085;

    --accent:#5b8def;
    --accent-hover:#7ba3f7;
    --accent-soft:rgba(91,141,239,0.12);
    --accent-text:#0f1117;

    --critical:#f87171;
    --critical-soft:rgba(248,113,113,0.1);
    --safe:#4ade80;
    --safe-soft:rgba(74,222,128,0.1);
    --warning:#fbbf24;
    --warning-soft:rgba(251,191,36,0.1);

    --b-bim:#67d6e8;
    --b-laser:#e8a948;
    --b-migration:#a78bfa;
    --b-apm:#f472b6;
    --b-aim:#6ee7b7;
    --b-digital:#7ba3f7;
    --b-software:#c084fc;
    --b-upgrade:#fb923c;

    --shadow-sm:0 1px 2px rgba(0,0,0,0.2);
    --shadow-md:0 4px 12px rgba(0,0,0,0.3);
    --shadow-lg:0 8px 24px rgba(0,0,0,0.4);

    --header-bg:rgba(15,17,23,0.92);
  }

  /* ===== RESET ===== */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--text);
    background:var(--bg);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* ===== HEADER ===== */
  .app-header{
    position:sticky;top:0;z-index:50;
    background:var(--header-bg);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1440px;margin:0 auto;padding:14px 28px;
    display:flex;align-items:center;gap:20px;
  }
  .brand{flex:1;min-width:0}
  .brand h1{
    font-family:var(--sans);
    font-weight:700;
    font-size:clamp(18px,2vw,22px);
    letter-spacing:-0.02em;
    line-height:1.2;
    color:var(--text);
  }
  .brand-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-top:1px;
  }
  .header-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

  /* ===== BUTTONS ===== */
  .btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:500;
    padding:7px 14px;
    border-radius:var(--radius-sm);
    transition:all .15s ease;
    white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-ghost{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
  }
  .btn-ghost:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface-2)}
  .btn-primary{
    background:var(--accent);color:var(--accent-text);border:1px solid var(--accent);
    font-weight:600;
  }
  .btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;
    border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text-dim);background:var(--surface);
    transition:all .15s;
  }
  .btn-icon:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-2)}

  /* ===== DEMO BANNER ===== */
  .demo-banner{
    background:var(--accent-soft);
    border-bottom:1px solid var(--border);
    padding:10px 28px;
    font-size:13px;
    color:var(--text-dim);
    display:flex;align-items:center;gap:8px;
  }
  .demo-banner::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .demo-banner.hidden{display:none}

  /* ===== MAIN ===== */
  main{
    max-width:1440px;margin:0 auto;padding:24px 28px 40px;
  }

  /* ===== KPI STRIP ===== */
  .kpi-strip{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:24px;
  }
  .kpi{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:18px 20px;
  }
  .kpi .label{
    font-size:11px;
    font-weight:500;
    color:var(--text-muted);
    margin-bottom:8px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .kpi .value{
    font-family:var(--sans);
    font-size:28px;
    font-weight:700;
    color:var(--text);
    line-height:1;
    letter-spacing:-0.02em;
  }
  .kpi .value .unit{
    font-size:13px;color:var(--text-muted);
    font-weight:400;margin-left:4px;letter-spacing:0;
  }
  .kpi .sub{
    margin-top:6px;
    font-size:12px;
    color:var(--text-muted);
  }
  .kpi .sub.urgent{color:var(--critical);font-weight:500}

  /* ===== FILTER BAR ===== */
  .filter-bar{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    margin-bottom:24px;
  }
  .filter-bar-main{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:12px 16px;
  }
  .search-wrap{
    flex:1 1 240px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:9px 14px 9px 36px;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    border-radius:var(--radius-sm);
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--accent)}
  .search-wrap .search-icon{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--text-muted);pointer-events:none;
  }
  .select-wrap{position:relative}
  .select-wrap select{
    padding:9px 30px 9px 12px;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:13px;
    border-radius:var(--radius-sm);
    appearance:none;-webkit-appearance:none;
    cursor:pointer;outline:none;
    transition:border-color .15s;
  }
  .select-wrap select:focus{border-color:var(--accent)}
  .select-wrap::after{
    content:"";position:absolute;right:10px;top:50%;
    transform:translateY(-50%);
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid var(--text-muted);
    pointer-events:none;
  }
  .filter-toggle{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:500;
    color:var(--text-dim);
    padding:8px 12px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    background:var(--surface);
    cursor:pointer;transition:all .15s;
  }
  .filter-toggle:hover{border-color:var(--border-strong);background:var(--surface-2)}
  .filter-toggle.active{border-color:var(--accent);color:var(--accent)}
  .filter-clear{color:var(--critical);border-color:var(--critical-soft)}
  .filter-clear:hover{background:var(--critical-soft);border-color:var(--critical)}
  .filter-clear.hidden{display:none}
  .filter-toggle svg{width:15px;height:15px}
  .filter-count{
    background:var(--accent);color:var(--accent-text);
    font-size:11px;font-weight:600;
    min-width:18px;height:18px;
    border-radius:9px;
    display:none;align-items:center;justify-content:center;
    padding:0 5px;
  }
  .filter-count.visible{display:inline-flex}

  /* advanced panel */
  .filter-bar-advanced{
    display:none;
    padding:14px 16px 16px;
    border-top:1px solid var(--border);
  }
  .filter-bar-advanced.open{
    display:block;
  }
  .filter-groups{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .filter-group{display:flex;flex-direction:column;gap:6px}
  .filter-label{
    font-size:11px;font-weight:500;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:0.04em;
  }
  .toggle-label{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;color:var(--text-dim);cursor:pointer;user-select:none;
    padding:7px 0;
  }
  .toggle-label input{accent-color:var(--accent);cursor:pointer;width:15px;height:15px}

  /* category chips */
  .category-chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-family:var(--sans);
    font-size:12px;font-weight:500;
    padding:5px 12px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    border-radius:20px;
    transition:all .15s;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:var(--chip-color,var(--text-muted));
  }
  .chip:hover{border-color:var(--chip-color,var(--accent));color:var(--text)}
  .chip.active{
    background:var(--chip-color,var(--accent));
    color:#fff;
    border-color:var(--chip-color,var(--accent));
  }
  .chip.active::before{background:rgba(255,255,255,0.7)}
  .chip .count{
    font-size:11px;opacity:.6;margin-left:1px;
  }

  /* ===== META ROW ===== */
  .tender-meta-row{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:14px;padding:0 2px;
  }
  .tender-count{
    font-size:13px;
    color:var(--text-muted);
  }
  .tender-count strong{color:var(--text);font-weight:600}

  /* ===== TENDER GRID ===== */
  .tender-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
    gap:14px;
  }
  .tender-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:20px;
    cursor:pointer;
    transition:box-shadow .15s,border-color .15s;
    display:flex;flex-direction:column;gap:10px;
    position:relative;
  }
  .tender-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}

  .card-header{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .card-category{
    font-size:12px;font-weight:600;
    letter-spacing:0.02em;text-transform:uppercase;
    color:var(--card-accent,var(--text-muted));
  }
  .card-deadline{
    font-family:var(--mono);
    font-size:12px;font-weight:600;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .card-deadline.urgent{color:var(--critical)}
  .card-deadline.soon{color:var(--warning)}
  .card-deadline .when{font-size:11px;font-weight:400;margin-left:6px;opacity:.7}

  .card-title{
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    line-height:1.35;
    color:var(--text);
    letter-spacing:-0.01em;
  }

  .card-scope{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.55;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .card-meta{
    font-size:12px;
    color:var(--text-muted);
    display:flex;flex-wrap:wrap;align-items:center;
    gap:4px 8px;
  }
  .meta-sep{
    width:3px;height:3px;
    background:var(--text-muted);border-radius:50%;
    display:inline-block;
  }

  .card-footer{
    display:flex;justify-content:space-between;align-items:center;
    padding-top:12px;border-top:1px solid var(--border);
    margin-top:auto;gap:8px;
  }
  .card-value{
    font-family:var(--mono);font-size:13px;
    color:var(--text);font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .card-value.empty{color:var(--text-muted);font-style:italic;font-weight:400}
  .card-badges{display:flex;align-items:center;gap:6px}

  .confidence-badge{
    font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:10px;
    text-transform:uppercase;letter-spacing:0.02em;
  }
  .confidence-badge.high{background:var(--safe-soft);color:var(--safe)}
  .confidence-badge.medium{background:var(--warning-soft);color:var(--warning)}
  .confidence-badge.low{background:var(--critical-soft);color:var(--critical)}

  .card-source{
    font-size:12px;font-weight:500;
    color:var(--accent);text-decoration:none;
    transition:opacity .15s;
  }
  .card-source:hover{opacity:.75}
  .card-source.broken{color:var(--critical);opacity:.7}

  /* URL badges */
  .url-badge{
    font-size:11px;font-weight:500;
    padding:2px 7px;border-radius:10px;
    display:inline-flex;align-items:center;gap:4px;
  }
  .url-badge.ok{background:var(--safe-soft);color:var(--safe)}
  .url-badge.broken{background:var(--critical-soft);color:var(--critical)}

  /* NEW badge */
  .new-badge{
    font-size:10px;letter-spacing:0.06em;
    text-transform:uppercase;font-weight:700;
    padding:2px 7px;
    background:var(--accent);color:var(--accent-text);
    border-radius:10px;
    margin-right:6px;
    animation:newPulse 1.6s ease-out 3;
  }
  @keyframes newPulse{
    0%{box-shadow:0 0 0 0 var(--accent-soft)}
    70%{box-shadow:0 0 0 8px transparent}
    100%{box-shadow:0 0 0 0 transparent}
  }

  /* ===== EMPTY STATE ===== */
  .empty{
    padding:80px 40px;text-align:center;
    border:2px dashed var(--border);
    border-radius:var(--radius-lg);
    background:var(--surface);
  }
  .empty h2{
    font-family:var(--sans);font-weight:600;
    font-size:20px;margin-bottom:8px;
    color:var(--text-dim);
  }
  .empty p{color:var(--text-muted);font-size:14px;max-width:480px;margin:0 auto 20px}

  /* ===== PAGINATION ===== */
  .pagination{
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 2px;flex-wrap:wrap;gap:12px;
  }
  .page-info{font-size:13px;color:var(--text-muted)}
  .page-buttons{display:flex;gap:4px;align-items:center}
  .page-btn{
    font-family:var(--sans);font-size:13px;font-weight:500;
    padding:6px 12px;
    border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);color:var(--text-dim);
    cursor:pointer;transition:all .15s;
  }
  .page-btn:hover{border-color:var(--accent);color:var(--accent)}
  .page-btn.active{
    background:var(--accent);color:var(--accent-text);
    border-color:var(--accent);font-weight:600;
  }
  .page-ellipsis{color:var(--text-muted);padding:0 4px}

  /* ===== DETAIL DRAWER ===== */
  .drawer-bg{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.35);
    backdrop-filter:blur(4px);
    z-index:100;
    opacity:0;pointer-events:none;
    transition:opacity .2s;
  }
  .drawer-bg.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;height:100%;
    width:min(640px,100%);
    background:var(--bg-alt);
    border-left:1px solid var(--border);
    z-index:101;
    transform:translateX(100%);
    transition:transform .25s ease;
    overflow-y:auto;
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0)}
  .drawer-head{
    padding:24px 28px 20px;
    border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--bg-alt);z-index:2;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  }
  .drawer-head .category-label{
    font-size:12px;font-weight:600;text-transform:uppercase;
    letter-spacing:0.02em;margin-bottom:10px;
  }
  .drawer-head h2{
    font-family:var(--sans);font-weight:600;
    font-size:22px;line-height:1.25;letter-spacing:-0.015em;
  }
  .close-btn{
    flex-shrink:0;
    font-size:18px;color:var(--text-muted);
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);border-radius:var(--radius-sm);
    transition:all .15s;
  }
  .close-btn:hover{color:var(--text);border-color:var(--border-strong)}
  .drawer-body{padding:24px 28px 40px;flex:1}
  .drawer-section{margin-bottom:24px}
  .drawer-section h3{
    font-size:11px;font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .info-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:1px;background:var(--border);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    overflow:hidden;
  }
  .info-cell{
    background:var(--surface);padding:14px 16px;
  }
  .info-cell .label{
    font-size:11px;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;
    font-weight:500;
  }
  .info-cell .val{font-size:14px;color:var(--text)}
  .info-cell .val.mono{font-family:var(--mono);font-size:13px}
  .scope-text{
    font-size:15px;line-height:1.65;color:var(--text-dim);
  }
  .key-points{list-style:none;padding:0}
  .key-points li{
    padding:10px 0 10px 24px;
    border-bottom:1px solid var(--border);
    font-size:14px;color:var(--text-dim);
    line-height:1.55;position:relative;
  }
  .key-points li:last-child{border-bottom:none}
  .key-points li::before{
    content:"";position:absolute;left:8px;top:16px;
    width:5px;height:5px;border-radius:50%;background:var(--accent);
  }
  .drawer-actions{
    display:flex;gap:8px;padding:16px 28px;
    border-top:1px solid var(--border);
    background:var(--surface);
    position:sticky;bottom:0;
  }
  .drawer-actions .btn{flex:1;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

  /* grounding / verified references */
  .ref-list{list-style:none;padding:0;margin:0}
  .ref-list li{
    padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;
  }
  .ref-list li:last-child{border-bottom:none}
  .ref-list a{color:var(--text-dim);text-decoration:none;word-break:break-all}
  .ref-list a:hover{color:var(--accent)}
  .ref-list .gt{display:block;color:var(--text);font-size:13px;margin-bottom:2px;font-weight:500}

  /* ===== AUTO-REFRESH BUTTON STATES ===== */
  #autoBtn .ar-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--text-muted);margin-right:4px;vertical-align:middle;
  }

  const d = new Date();
  d.setUTCDate(d.getUTCDate() + n);
  d.setUTCHours(14, 0, 0, 0);
  return d.toISOString();
}

// ---------- Helpers ----------
function esc(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ---------- State ----------
const state = {
  tenders: [],
  isDemo: true,
  lastRun: null,
  page: 1,
  pageSize: 24,
  filters: {
    search: "",
    buckets: new Set(),
    region: "",
    confidence: "",
    sort: "deadline",
    hideClosed: true
  }
};
const NEW_BADGE_MS = 5 * 60 * 1000;

// ---------- Storage helpers ----------
const MAX_STORED_TENDERS = 2000;
function serializeFilters(){
  return {
    search: state.filters.search,
    buckets: [...state.filters.buckets],
    region: state.filters.region,
    confidence: state.filters.confidence,
    sort: state.filters.sort,
    hideClosed: state.filters.hideClosed
  };
}
function restoreFilters(saved){
  if(!saved) return;
  if(typeof saved.search === "string") state.filters.search = saved.search;
  if(Array.isArray(saved.buckets)) state.filters.buckets = new Set(saved.buckets);
  if(typeof saved.region === "string") state.filters.region = saved.region;
  if(typeof saved.confidence === "string") state.filters.confidence = saved.confidence;
  if(typeof saved.sort === "string") state.filters.sort = saved.sort;
  if(typeof saved.hideClosed === "boolean") state.filters.hideClosed = saved.hideClosed;
}
function trySave(){
  try{
    if(!state.isDemo){
      const toStore = state.tenders.length > MAX_STORED_TENDERS
        ? state.tenders.slice(-MAX_STORED_TENDERS)
        : state.tenders;
      localStorage.setItem("tender_dashboard", JSON.stringify({
        tenders: toStore, lastRun: state.lastRun, filters: serializeFilters()
      }));
    }
  }catch(e){
    console.warn("localStorage save failed (quota?):", e);
    toast("Warning: local storage full \u2014 oldest tenders may not persist across reloads");
  }
}
function tryLoad(){
  try{
    const raw = localStorage.getItem("tender_dashboard");
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(data && Array.isArray(data.tenders) && data.tenders.length){
      state.tenders = data.tenders;
      state.lastRun = data.lastRun;
      state.isDemo = false;
      restoreFilters(data.filters);
      return true;
    }
  }catch(e){}
  return false;
}

// ---------- File loading ----------
document.getElementById("fileInput").addEventListener("change", async (e)=>{
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  await ingestFiles(files);
  e.target.value = "";
});

async function ingestFiles(files){
  let added = 0, kept = 0, errors = 0;
  if(state.isDemo){
    state.tenders = [];
    state.isDemo = false;
  }
  const seenIds = new Set(state.tenders.map(t=>t.id));
  let newestRun = state.lastRun;

  for(const f of files){
    try{
      const text = await f.text();
      const doc = JSON.parse(text);
      const arr = Array.isArray(doc) ? doc : (doc.tenders || []);
      const shard = doc.shard || (f.name.match(/^([a-z0-9_]+)_tenders_/)?.[1]) || "";
      const grounding = Array.isArray(doc.grounding_urls) ? doc.grounding_urls : [];
      if(doc.run_timestamp_utc && (!newestRun || doc.run_timestamp_utc > newestRun)){
        newestRun = doc.run_timestamp_utc;
      }
      const now = Date.now();
      for(const t of arr){
        if(!t || !t.id) continue;
        if(seenIds.has(t.id)){ kept++; continue; }
        seenIds.add(t.id);
        if(shard && !t._shard) t._shard = shard;
        if(grounding.length) t._grounding = grounding;
        t._freshAt = now;
        state.tenders.push(t);
        added++;
      }
    }catch(err){
      console.error("Parse failed:", f.name, err);
      errors++;
    }
  }
  state.lastRun = newestRun;
  trySave();
  render();
  toast(`Loaded ${added} new tender${added===1?"":"s"}` +
        (kept ? ` \u00b7 ${kept} duplicate${kept===1?"":"s"} skipped`:"") +
        (errors ? ` \u00b7 ${errors} file error${errors===1?"":"s"}`:""));
}

window.addEventListener("drop", async (e)=>{

  if(files.length) await ingestFiles(files);
});

      confidence: state.filters.confidence

    tenders_found: visible.length,
    tenders: visible
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tender_export_${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`Exported ${visible.length} tender${visible.length===1?"":"s"}`);
});

// ---------- CSV Export ----------
const CSV_COLS = [
  "id","title","region","country","tendering_authority",
  "domain_industry","service_bucket","scope_summary",
  "deadline_utc","published_utc","value_amount","value_currency",
  "source_url","confidence"
];
function csvEscape(v){
  if(v === null || v === undefined) return "";
  if(typeof v === "object") v = JSON.stringify(v);
  v = String(v);
  if(/[",\r\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
document.getElementById("exportCsvBtn").addEventListener("click", ()=>{
  const visible = currentVisible();
  const lines = [CSV_COLS.join(",")];
  for(const t of visible){
    lines.push(CSV_COLS.map(c=>csvEscape(t[c])).join(","));
  }
  const blob = new Blob([lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `tender_export_${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`Exported ${visible.length} tender${visible.length===1?"":"s"} (CSV)`);
});

function fmtAgo(ts){
  if(!ts) return "\u2014";
  const s = Math.round((Date.now() - ts)/1000);
  if(s < 60) return `${s}s ago`;
  if(s < 3600) return `${Math.round(s/60)}m ago`;
  return `${Math.round(s/3600)}h ago`;
}
function renderAutoBtn(){
  autoBtn.classList.remove("btn-primary","polling","failed");
  autoBtn.classList.add("btn-ghost");
  if(!auto.on){
    autoBtn.textContent = "Auto-refresh: off";
    return;
  }
  if(auto.inflight){
    autoBtn.classList.remove("btn-ghost");
    autoBtn.classList.add("polling");
    autoBtn.innerHTML = `<span class="ar-dot"></span>Polling\u2026`;
    return;
  }
  if(auto.failStreak >= 3){
    autoBtn.classList.remove("btn-ghost");
    autoBtn.classList.add("failed");
    autoBtn.innerHTML = `<span class="ar-dot"></span>Auto-refresh: failed`;
    return;
  }
  autoBtn.classList.remove("btn-ghost");
  autoBtn.classList.add("btn-primary");
  const ago = auto.lastOk ? fmtAgo(auto.lastOk) : "starting\u2026";
  autoBtn.innerHTML = `<span class="ar-dot"></span>Auto-refresh: on \u00b7 ${ago}`;
}

async function pollOnce(){
  if(auto.inflight) return;
  auto.inflight = true;
  renderAutoBtn();
  auto.lastPollAt = Date.now();
  try{
    const res = await fetch("tender_results/index.json?_=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("manifest HTTP " + res.status);
    const manifest = await res.json();
    const runs = Array.isArray(manifest.runs) ? manifest.runs : [];
    const newRuns = runs.filter(r => r.file && !auto.knownFiles.has(r.file));
    auto.lastOk = Date.now();
    auto.failStreak = 0;
    if(!newRuns.length){ auto.noChangeStreak++; rescheduleAuto(); return; }
    auto.noChangeStreak = 0;
    rescheduleAuto();
    let added = 0, kept = 0;
    if(state.isDemo){ state.tenders = []; state.isDemo = false; }
    const seenIds = new Set(state.tenders.map(t=>t.id));
    let newestRun = state.lastRun;
    const now = Date.now();
    for(const r of newRuns){
      try{
        const fr = await fetch("tender_results/" + r.file + "?_=" + Date.now(), {cache:"no-store"});
        if(!fr.ok) continue;
        const doc = await fr.json();
        const arr = Array.isArray(doc) ? doc : (doc.tenders || []);
        const shard = r.shard || doc.shard || "";
        const grounding = Array.isArray(doc.grounding_urls) ? doc.grounding_urls : [];
        if(doc.run_timestamp_utc && (!newestRun || doc.run_timestamp_utc > newestRun)){
          newestRun = doc.run_timestamp_utc;
        }
        for(const t of arr){
          if(!t || !t.id) continue;
          if(seenIds.has(t.id)){ kept++; continue; }
          seenIds.add(t.id);
          if(shard && !t._shard) t._shard = shard;
          if(grounding.length) t._grounding = grounding;
          t._freshAt = now;
          state.tenders.push(t);
          added++;
        }
        auto.knownFiles.add(r.file);
      }catch(err){ console.warn("fetch failed", r.file, err); }
    }
    state.lastRun = newestRun;
    trySave();
    render();
    if(added) toast(`Auto-refresh: +${added} new` + (kept?` \u00b7 ${kept} dup`:""));
  }catch(err){
    console.warn("Auto-refresh poll failed:", err);
    auto.failStreak += 1;
    if(auto.on && !auto.warned){
      auto.warned = true;
      toast("Auto-refresh needs an HTTP server (run: python -m http.server) in the project root");
    }
  }finally{
    auto.inflight = false;
    renderAutoBtn();
  }
}

function currentInterval(){
  return Math.min(auto.intervalMs + auto.noChangeStreak * 60000, auto.maxIntervalMs);
}
function rescheduleAuto(){
  if(!auto.on) return;
  if(auto.timer){ clearInterval(auto.timer); auto.timer = null; }
  auto.timer = setInterval(pollOnce, currentInterval());
}
function setAuto(on){
  auto.on = on;
  if(auto.timer){ clearInterval(auto.timer); auto.timer = null; }
  if(auto.statusTimer){ clearInterval(auto.statusTimer); auto.statusTimer = null; }
  if(on){
    auto.warned = false;
    auto.failStreak = 0;
    auto.noChangeStreak = 0;
    pollOnce();
    auto.timer = setInterval(pollOnce, auto.intervalMs);
    auto.statusTimer = setInterval(renderAutoBtn, 5000);
  }
  renderAutoBtn();
}

// ---------- Filtering / sorting ----------
function currentVisible(){
  const f = state.filters;
  const q = f.search.trim().toLowerCase();
  const nowMs = Date.now();
  let out = state.tenders.filter(t=>{
    if(f.hideClosed && t.deadline_utc){
      const dms = new Date(t.deadline_utc).getTime();
      if(!Number.isNaN(dms) && dms < nowMs) return false;
    }
    if(f.buckets.size && !f.buckets.has(t.service_bucket)) return false;
    if(f.region && t.region !== f.region) return false;
    if(f.confidence === "high" && t.confidence !== "high") return false;
    if(f.confidence === "medium" && t.confidence === "low") return false;
    if(q){
      const hay = [
        t.title, t.tendering_authority, t.country, t.region,
        t.domain_industry, t.scope_summary
      ].filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const farFuture = "9999-12-31T00:00:00Z";
  switch(f.sort){
    case "deadline":
      out.sort((a,b)=> (a.deadline_utc||farFuture).localeCompare(b.deadline_utc||farFuture)); break;
    case "published":
      out.sort((a,b)=> (b.published_utc||"").localeCompare(a.published_utc||"")); break;
    case "value":
      out.sort((a,b)=> {
        const ca = (a.estimated_value?.currency||"ZZZ"), cb = (b.estimated_value?.currency||"ZZZ");
        if(ca !== cb) return ca.localeCompare(cb);
        return (b.estimated_value?.amount||0) - (a.estimated_value?.amount||0);
      }); break;
    case "title":
      out.sort((a,b)=> (a.title||"").localeCompare(b.title||"")); break;
  }
  return out;
}

let _filterPanelOpen = false;
function render(){
  // Preserve filter panel open/close state across re-renders
  _filterPanelOpen = filterAdvanced.classList.contains("open");
  renderBanner();
  renderKPIs();
  renderRegionOptions();
  renderCategoryChips();
  renderList();
  renderMetaRow();
  updateFilterCount();
  // Restore panel state (in case any render path disturbed it)
  filterAdvanced.classList.toggle("open", _filterPanelOpen);
  filterToggle.classList.toggle("active", _filterPanelOpen);
}

function closedCount(){
  const now = Date.now();
  return state.tenders.filter(t=>{
    if(!t.deadline_utc) return false;
    const dms = new Date(t.deadline_utc).getTime();
    return !Number.isNaN(dms) && dms < now;
  }).length;
}

function renderBanner(){
  document.getElementById("demoBanner").classList.toggle("hidden", !state.isDemo);
}

function fmtValue(v){
  if(!v || v.amount == null) return null;
  const a = v.amount;
  let s;
  if(a >= 1e9) s = (a/1e9).toFixed(2)+"B";
  else if(a >= 1e6) s = (a/1e6).toFixed(2)+"M";
  else if(a >= 1e3) s = (a/1e3).toFixed(0)+"K";
  else s = String(a);
  return `${s} ${v.currency || ""}`.trim();
}

function daysUntil(iso){
  if(!iso) return null;
  const ms = new Date(iso) - new Date();
  return Math.ceil(ms / 86400000);
}
function fmtDate(iso){
  if(!iso) return "\u2014";
  return new Date(iso).toISOString().slice(0,10);
}
function fmtDateTime(iso){
  if(!iso) return "\u2014";
  return new Date(iso).toISOString().replace("T"," ").slice(0,16) + " UTC";
}
function urlBadge(t){
  const s = t.url_status;
  if(s === "ok" || s === "redirect_ok")
    return `<span class="url-badge ok" title="Source URL verified">\u2713 verified</span>`;
  if(s === "broken")
    return `<span class="url-badge broken" title="Source URL did not respond">\u2717 broken</span>`;
  return "";
}
function relativeTime(iso){
  if(!iso) return "\u2014";
  const diffH = (new Date() - new Date(iso))/3600000;
  if(diffH < 1) return `${Math.round(diffH*60)}m ago`;
  if(diffH < 24) return `${Math.round(diffH)}h ago`;
  return `${Math.round(diffH/24)}d ago`;
}

function renderKPIs(){
  const ts = state.tenders;
  const week = ts.filter(t=> { const d = daysUntil(t.deadline_utc); return d!=null && d>=0 && d<=7; }).length;
  const high = ts.filter(t=> t.confidence === "high").length;
  const regions = new Set(ts.map(t=>t.region).filter(Boolean));
  const rc = {};
  ts.forEach(t => { if(t.region) rc[t.region] = (rc[t.region]||0)+1; });
  let topRegion = "", topRC = 0;
  for(const [k,v] of Object.entries(rc)){ if(v > topRC){ topRegion = k; topRC = v; } }

  const kpis = [
    { label: "Total tenders", value: ts.length, sub: `${high} verified` },
    { label: "Closing soon", value: week, sub: "within 7 days", urgent: week > 0 },
    { label: "Regions", value: regions.size, sub: topRegion ? `${topRegion} leads` : "No data" },
    { label: "Last updated", value: state.lastRun ? relativeTime(state.lastRun) : "\u2014", sub: fmtDate(state.lastRun) }
  ];

  document.getElementById("kpiStrip").innerHTML = kpis.map(k => `
    <div class="kpi">
      <div class="label">${k.label}</div>
      <div class="value">${k.value}${k.unit?` <span class="unit">${k.unit}</span>`:""}</div>
      <div class="sub${k.urgent?" urgent":""}">${k.sub||""}</div>
    </div>
  `).join("");
}

function renderRegionOptions(){
  const sel = document.getElementById("regionFilter");
  const regions = [...new Set(state.tenders.map(t=>t.region).filter(Boolean))].sort();
  const current = state.filters.region;
  sel.innerHTML = `<option value="">All regions</option>` +
    regions.map(r=>`<option value="${esc(r)}"${r===current?" selected":""}>${esc(r)}</option>`).join("");
}

function renderCategoryChips(){
  // Count from filtered subset (excluding bucket filter itself) so counts stay relevant
  const f = state.filters;
  const q = f.search.trim().toLowerCase();
  const nowMs = Date.now();
  const base = state.tenders.filter(t=>{
    if(f.hideClosed && t.deadline_utc){
      const dms = new Date(t.deadline_utc).getTime();
      if(!Number.isNaN(dms) && dms < nowMs) return false;
    }
    if(f.region && t.region !== f.region) return false;
    if(f.confidence === "high" && t.confidence !== "high") return false;
    if(f.confidence === "medium" && t.confidence === "low") return false;
    if(q){
      const hay = [t.title,t.tendering_authority,t.country,t.region,t.domain_industry,t.scope_summary].filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const counts = {};
  base.forEach(t => { counts[t.service_bucket] = (counts[t.service_bucket]||0)+1; });
  const chipsEl = document.getElementById("bucketChips");
  chipsEl.innerHTML = Object.entries(BUCKETS).map(([key, meta])=>{
    const n = counts[key] || 0;
    const active = state.filters.buckets.has(key);
    return `<button class="chip ${active?"active":""}" data-bucket="${key}" style="--chip-color:${meta.color}">
      ${meta.label}<span class="count">${n}</span>
    </button>`;
  }).join("");
}

// Event delegation for category chips (avoids re-binding on every render)
document.getElementById("bucketChips").addEventListener("click", (e)=>{
  const btn = e.target.closest(".chip");
  if(!btn) return;
  const b = btn.dataset.bucket;
  if(state.filters.buckets.has(b)) state.filters.buckets.delete(b);
  else state.filters.buckets.add(b);
  state.page = 1;
  render();
});

function renderMetaRow(){
  const visible = currentVisible();
  const closed = state.filters.hideClosed ? closedCount() : 0;
  const hiddenHint = closed ? ` \u00b7 <strong>${closed}</strong> expired hidden` : "";
  document.getElementById("tenderCount").innerHTML =
    `Showing <strong>${visible.length}</strong> of <strong>${state.tenders.length}</strong> tenders${hiddenHint}`;
  document.getElementById("lastUpdate").textContent =
    state.lastRun ? `Last run \u00b7 ${fmtDateTime(state.lastRun)}` : "No run timestamp";
}

function renderList(){
  const area = document.getElementById("tenderArea");
  const visible = currentVisible();

  if(!visible.length){
    area.innerHTML = `
      <div class="empty">
        <h2>No tenders match</h2>
        <p>${state.tenders.length ? "Adjust filters or clear search to see more results." :
          "Turn on <strong>Auto-refresh</strong> to fetch your latest runs, or drop a JSON file anywhere on this window."}</p>
      </div>`;
    return;
  }

  const totalPages = Math.ceil(visible.length / state.pageSize);
  if(state.page > totalPages) state.page = totalPages;
  if(state.page < 1) state.page = 1;

  const start = (state.page - 1) * state.pageSize;
  const pageItems = visible.slice(start, start + state.pageSize);

  area.innerHTML =
    `<div class="tender-grid">${pageItems.map(t => cardHTML(t)).join("")}</div>` +
    (totalPages > 1 ? renderPagination(state.page, totalPages, visible.length) : "");

  area.querySelectorAll(".tender-card").forEach(el=>{
    el.addEventListener("click", (ev)=>{
      if(ev.target.closest("a")) return;
      openDrawer(el.dataset.id);
    });
  });

  area.querySelectorAll("[data-page]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.page = parseInt(btn.dataset.page);
      renderList();
      renderMetaRow();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function renderPagination(current, total, totalItems){
  let buttons = "";
  if(current > 1)
    buttons += `<button class="page-btn" data-page="${current-1}">\u2190 Previous</button>`;

  const pages = new Set([1, total, current, current-1, current+1].filter(p => p >= 1 && p <= total));
  const sorted = [...pages].sort((a,b) => a - b);
  let last = 0;
  for(const p of sorted){
    if(p - last > 1) buttons += `<span class="page-ellipsis">\u2026</span>`;
    buttons += `<button class="page-btn ${p === current ? 'active' : ''}" data-page="${p}">${p}</button>`;
    last = p;
  }

  if(current < total)
    buttons += `<button class="page-btn" data-page="${current+1}">Next \u2192</button>`;

  return `<div class="pagination">
    <span class="page-info">Page ${current} of ${total} (${totalItems} tenders)</span>
    <div class="page-buttons">${buttons}</div>
  </div>`;
}

function cardHTML(t){
  const meta = BUCKETS[t.service_bucket] || { label: t.service_bucket || "\u2014", color: "var(--text-muted)" };
  const days = daysUntil(t.deadline_utc);
  let deadlineCls = "";
  let deadlineText = "\u2014";
  let deadlineWhen = "";
  if(days != null){
    if(days < 0){ deadlineCls = "urgent"; deadlineText = "Closed"; deadlineWhen = fmtDate(t.deadline_utc); }
    else if(days <= 7){ deadlineCls = "urgent"; deadlineText = `${days}d left`; deadlineWhen = fmtDate(t.deadline_utc); }
    else if(days <= 30){ deadlineCls = "soon"; deadlineText = `${days}d left`; deadlineWhen = fmtDate(t.deadline_utc); }
    else { deadlineText = `${days}d left`; deadlineWhen = fmtDate(t.deadline_utc); }
  }
  const val = fmtValue(t.estimated_value);
  const isFresh = t._freshAt && (Date.now() - t._freshAt) < NEW_BADGE_MS;
  const conf = t.confidence || "medium";

  return `
    <article class="tender-card" data-id="${esc(t.id)}" style="--card-accent:${meta.color}">
      <div class="card-header">
        <span>
          ${isFresh ? `<span class="new-badge">NEW</span>` : ""}
          <span class="card-category" style="color:${meta.color}">${esc(meta.label)}</span>
        </span>
        <span class="card-deadline ${deadlineCls}">${deadlineText}${deadlineWhen ? `<span class="when">${deadlineWhen}</span>` : ""}</span>
      </div>
      <h3 class="card-title">${esc(t.title || "Untitled tender")}</h3>
      <p class="card-scope">${esc(t.scope_summary || "No scope summary provided.")}</p>
      <div class="card-meta">
        <span>${esc(t.tendering_authority || "Unknown authority")}</span>
        <span class="meta-sep"></span>
        <span>${esc(t.country || t.region || "\u2014")}</span>
        ${t.domain_industry ? `<span class="meta-sep"></span><span>${esc(t.domain_industry)}</span>` : ""}
      </div>
      <div class="card-footer">
        <span class="card-value ${val?"":"empty"}">${val ? esc(val) : "Value not disclosed"}</span>
        <span class="card-badges">
          <span class="confidence-badge ${conf}">${esc(conf)}</span>
          ${urlBadge(t)}
          ${t.source_url ? `<a class="card-source ${t.url_status==='broken'?'broken':''}" href="${esc(t.source_url)}" target="_blank" rel="noopener">Source \u2197</a>` : ""}
        </span>
      </div>
    </article>`;
}

          <ul class="ref-list">

  filterAdvanced.classList.toggle("open");
  filterToggle.classList.toggle("active");
  if(filterOverlay) filterOverlay.classList.toggle("open", opening);
});
if(filterOverlay){
  filterOverlay.addEventListener("click", ()=>{
    filterAdvanced.classList.remove("open");
    filterToggle.classList.remove("active");
    filterOverlay.classList.remove("open");
  });
}

function updateFilterCount(){
  let count = 0;
  if(state.filters.confidence) count++;
  if(!state.filters.hideClosed) count++;
  if(state.filters.buckets.size) count++;
  const badge = document.getElementById("filterCount");
  badge.textContent = count || "";
  badge.classList.toggle("visible", count > 0);
  // Show "Clear" button when any filter (including main bar) is active
  const anyActive = count > 0 || state.filters.search || state.filters.region;
  document.getElementById("clearFilters").classList.toggle("hidden", !anyActive);
}

document.getElementById("clearFilters").addEventListener("click", ()=>{
  state.filters.search = "";
  state.filters.buckets = new Set();
  state.filters.region = "";
  state.filters.confidence = "";
  state.filters.sort = "deadline";
  state.filters.hideClosed = true;
  state.page = 1;
  syncFilterDOM();
  render();
  trySave();
  toast("Filters cleared");
});

// ---------- Theme toggle ----------
function getPreferredTheme(){
  const stored = localStorage.getItem("tender_theme");
  if(stored === "dark" || stored === "light") return stored;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(theme){
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("tender_theme", theme);
  const btn = document.getElementById("themeToggle");
  // Sun icon for dark mode (click to go light), moon for light mode (click to go dark)
  btn.innerHTML = theme === "dark"
    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`
    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  btn.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
}
document.getElementById("themeToggle").addEventListener("click", ()=>{
  const current = document.documentElement.dataset.theme || "light";
  applyTheme(current === "dark" ? "light" : "dark");
});

// ---------- Bind filter inputs ----------
let searchTimer;
document.getElementById("search").addEventListener("input", e=>{
  state.filters.search = e.target.value;
  state.page = 1;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ renderList(); renderMetaRow(); updateFilterCount(); trySave(); }, 250);
});
document.getElementById("regionFilter").addEventListener("change", e=>{
  state.filters.region = e.target.value;
  state.page = 1;
  render(); trySave();
});
document.getElementById("confFilter").addEventListener("change", e=>{
  state.filters.confidence = e.target.value;
  state.page = 1;
  render(); trySave();
});
document.getElementById("sortBy").addEventListener("change", e=>{
  state.filters.sort = e.target.value;
  state.page = 1;
  renderList(); trySave();
});
document.getElementById("hideClosed").addEventListener("change", e=>{
  state.filters.hideClosed = e.target.checked;
  state.page = 1;
  render(); trySave();
});

// Re-render every ~60s so NEW badges expire
setInterval(()=>{
  const anyFresh = state.tenders.some(t => t._freshAt && (Date.now() - t._freshAt) < NEW_BADGE_MS + 60000);
  if(anyFresh) renderList();
}, 60000);

// ---------- Sync filter DOM from state ----------
function syncFilterDOM(){
  document.getElementById("search").value = state.filters.search;
  document.getElementById("regionFilter").value = state.filters.region;
  document.getElementById("confFilter").value = state.filters.confidence;
  document.getElementById("sortBy").value = state.filters.sort;
  document.getElementById("hideClosed").checked = state.filters.hideClosed;
}

// ---------- Init ----------
applyTheme(getPreferredTheme());
const loaded = tryLoad();
if(!loaded) loadDemo();
syncFilterDOM();
render();
</script>
</body>
</html>
